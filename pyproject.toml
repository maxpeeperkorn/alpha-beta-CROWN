[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-beta-crown"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gurobipy>=10",
    "onnx2pytorch",
    "onnxoptimizer>=0.3",
    "onnxruntime>=1.15",
    "onnxsim>=0.4.31",
    "pandas>=2.0",
    "psutil>=5.9.5",
    "pyyaml>=6.0",
    "skl2onnx>=1.14",
    "sortedcontainers>=2.4",
    "termcolor>=2.3.0",
]

[tool.uv.sources]
onnx2pytorch = { git = "https://github.com/Verified-Intelligence/onnx2pytorch.git" }
